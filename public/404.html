<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>maak</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0c0e; }
      .splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: "Tajawal", system-ui, sans-serif; color: #a8a9a2; font-size: 15px; font-weight: 600; }
      .brand-tile { width: 64px; height: 64px; animation: maak-pulse 0.8s ease-in-out infinite; }
      @keyframes maak-pulse { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    </style>
    <script>
      (function () {
        var BASE = "/Maak/";
        var loc = window.location;
        if (loc.pathname.indexOf(BASE) !== 0 || loc.pathname === BASE) { return; }
        try {
          sessionStorage.setItem("maak:deep-link", loc.pathname + loc.search + loc.hash);
        } catch (e) {}
        loc.replace(BASE);
      })();
    </script>
  </head>
  <body>
    <div class="splash"><img class="brand-tile" src="./icon-192.png" alt="maak" /></div>
  </body>
</html>
