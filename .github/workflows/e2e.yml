name: E2E Maak

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      MAAK_E2E_BASE_URL: http://127.0.0.1:4173
      MAAK_E2E_PROVIDER_EMAIL: e2e-provider@maak.test
      MAAK_E2E_CUSTOMER_EMAIL: e2e-customer@maak.test
      MAAK_E2E_ADMIN_EMAIL: e2e-admin@maak.test
      MAAK_E2E_STATE_FILE: test-results/e2e-state.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve frontend dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate ephemeral local-only E2E credentials
        shell: bash
        run: |
          provider_password="$(openssl rand -hex 16)A9!"
          customer_password="$(openssl rand -hex 16)B7!"
          admin_password="$(openssl rand -hex 16)C5!"
          echo "::add-mask::$provider_password"
          echo "::add-mask::$customer_password"
          echo "::add-mask::$admin_password"
          {
            echo "MAAK_E2E_PROVIDER_PASSWORD=$provider_password"
            echo "MAAK_E2E_CUSTOMER_PASSWORD=$customer_password"
            echo "MAAK_E2E_ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Temporarily hold repository migrations
        shell: bash
        run: |
          mv supabase/migrations supabase/migrations.release
          mkdir -p supabase/migrations
          echo "SUPABASE_MIGRATIONS_HELD=1" >> "$GITHUB_ENV"

      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy

      - name: Export isolated Supabase connection settings
        shell: bash
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LOCAL_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Bootstrap isolated pre-migration schema
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/supabase-bootstrap.sql

      - name: Restore repository migrations
        shell: bash
        run: |
          rm -rf supabase/migrations
          mv supabase/migrations.release supabase/migrations
          echo "SUPABASE_MIGRATIONS_HELD=0" >> "$GITHUB_ENV"

      - name: Apply repository migrations
        run: |
          supabase migration up
          supabase migration list

      - name: Verify local migration state
        run: supabase status

      - name: Seed isolated E2E fixtures
        run: |
          node scripts/seed-e2e.mjs
          node scripts/seed-e2e-fixtures.mjs

      - name: Start frontend for Chromium
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/maak-vite.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/maak-vite.pid"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/maak-vite.log"
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Run missing-config browser gate on a separate Vite process
        shell: bash
        run: |
          set -euo pipefail
          env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY \
            npm run dev -- --host 127.0.0.1 --port 4174 > "$RUNNER_TEMP/maak-vite-negative.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY \
            MAAK_E2E_BASE_URL=http://127.0.0.1:4174 \
            npx playwright test tests/e2e/config-negative.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maak-playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/maak-vite.log
            ${{ runner.temp }}/maak-vite-negative.log
          if-no-files-found: ignore

      - name: Cleanup isolated E2E fixtures
        if: always()
        run: |
          node scripts/seed-e2e-fixtures.mjs --cleanup || true
          node scripts/seed-e2e.mjs --cleanup || true

      - name: Stop frontend
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/maak-vite.pid" ]; then kill "$(cat "$RUNNER_TEMP/maak-vite.pid")" 2>/dev/null || true; fi
          pkill -f "vite.*--port 4173" 2>/dev/null || true

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Restore repository migrations after failure
        if: always()
        shell: bash
        run: |
          if [ -d supabase/migrations.release ]; then
            rm -rf supabase/migrations
            mv supabase/migrations.release supabase/migrations
          fi
