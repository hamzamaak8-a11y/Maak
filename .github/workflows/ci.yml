name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: No unofficial endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on references to the retired Worker account
        run: |
          if git grep -nI -e 'i36508871' -- . ':!.github/workflows/ci.yml'; then
            echo "Found a reference to the retired, unofficial Worker account." >&2
            exit 1
          fi

  app:
    name: App typecheck & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Export web build (app)
        run: npx expo export --platform web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - name: Export web build (administration panel)
        run: npx expo export --clear --platform web --output-dir dist-admin
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_APP_TARGET: admin

  worker:
    name: Worker typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
