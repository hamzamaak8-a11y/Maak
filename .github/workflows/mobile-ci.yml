name: Maak Mobile CI

on:
  push:
    branches: ["fix/maak-p0-visual-runtime"]
  pull_request:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Expo doctor
        run: npx expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Export web smoke build
        run: npx expo export --platform web
