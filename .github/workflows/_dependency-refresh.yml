# Temporary one-shot dependency lock refresh for TASK #10; removed automatically after success.
# Retry after aligning @cloudflare/workers-types with Wrangler 4.
name: Refresh worker dependency lock

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Refresh Worker lockfile
        working-directory: worker
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/package-lock.json
          git rm .github/workflows/_dependency-refresh.yml
          git commit -m "chore: refresh worker dependency lock"
          git push
