name: Build Maak

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Verify production artifacts
        run: npm run qa:smoke

      - name: Refresh Worker lockfile
        working-directory: worker
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed Worker lockfile
        run: |
          if git diff --quiet -- worker/package-lock.json; then
            echo "Worker lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/package-lock.json
          git commit -m "chore: refresh worker dependency lock"
          git push

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Typecheck Worker
        run: npm run typecheck --prefix worker

      - name: Build Worker dry-run
        run: npm run build --prefix worker
