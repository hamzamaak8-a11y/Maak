name: Build Maak

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve frontend dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci

      - name: Syntax-check E2E seed tool
        run: node --check scripts/seed-e2e.mjs && node --check scripts/seed-e2e-fixtures.mjs

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Verify production artifacts
        run: npm run qa:smoke

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --audit-level=moderate

      - name: Typecheck Worker
        run: npm run typecheck --prefix worker

      - name: Build Worker dry-run
        run: npm run build --prefix worker
