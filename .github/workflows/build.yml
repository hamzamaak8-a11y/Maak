name: Build Maak

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Verify production artifacts
        run: npm run qa:smoke

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Typecheck Worker
        run: npm run typecheck --prefix worker

      - name: Build Worker dry-run
        run: npm run build --prefix worker
